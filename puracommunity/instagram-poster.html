<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pura · Instagram Schedule Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --rust:#97644e; --sage:#8f997f; --mauve:#b49492;
    --peach-pale:#f4ddd4; --sage-pale:#cdd3c4; --blush-pale:#f7e6e5; --special-pale:#efe2ea;
    --tx-rust:#5e3a2b; --tx-sage:#414b34; --tx-mauve:#6d4744;
    --ink:#5a4a44; --white:#fdfaf7; --line:#ece0d6; --muted:#8c7a6c;
  }
  body { background:#e7ded2; font-family:'Jost',sans-serif; font-weight:300; color:var(--ink); padding:24px; }
  .app { max-width:1180px; margin:0 auto; }
  h2.tool { font-family:'Cormorant Garamond',serif; font-weight:400; color:var(--rust); font-size:1.8rem; margin-bottom:2px; }
  .toolsub { font-size:0.78rem; letter-spacing:0.04em; color:var(--muted); margin-bottom:18px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; background:var(--white); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:20px; }
  .controls .grp { display:flex; align-items:center; gap:8px; }
  .controls label { font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
  select { font-family:'Cormorant Garamond',serif; font-size:1.05rem; color:var(--rust); background:var(--white); border:1px solid var(--line); border-radius:4px; padding:6px 26px 6px 10px; cursor:pointer; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button { font-family:'Jost',sans-serif; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; padding:8px 14px; background:var(--white); color:var(--muted); border:none; cursor:pointer; border-left:1px solid var(--line); }
  .seg button:first-child { border-left:none; }
  .seg button.on { background:var(--rust); color:var(--white); }
  .dl { margin-left:auto; font-family:'Jost',sans-serif; font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; padding:11px 22px; background:var(--rust); color:var(--white); border:none; border-radius:4px; cursor:pointer; }
  .dl:disabled { opacity:0.5; cursor:default; }
  .status { font-size:0.75rem; color:var(--muted); margin-bottom:14px; min-height:1em; }
  .stagewrap { display:flex; justify-content:center; background:#d8cdbf; border-radius:8px; padding:24px; overflow:auto; }
  .scaler { transform-origin:top center; }

  /* ============ shared frame ============ */
  .frame { background:var(--white); overflow:hidden; }
  .frame .n, .frame .rname, .frame .dfull, .frame h1, .frame .dh, .frame .title { font-family:'Cormorant Garamond',serif; }

  /* grid shared */
  .grid { display:grid; }
  .dh { color:var(--ink); text-align:center; border-bottom:1px solid var(--line); }
  .dh.rest { color:var(--muted); }
  .th { text-transform:uppercase; color:var(--muted); font-weight:500; display:flex; align-items:center; justify-content:flex-end; }
  .cell { display:flex; }
  .blk { flex:1; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .blk .n { font-weight:500; line-height:1.05; }
  .blk .tea { font-style:italic; }
  .blk.reformer { background:var(--peach-pale); color:var(--tx-rust); }
  .blk.mat { background:var(--sage-pale); color:var(--tx-sage); }
  .blk.yoga { background:var(--blush-pale); color:var(--tx-mauve); } .blk.yoga .n { font-style:italic; }
  .blk.special { background:var(--special-pale); color:var(--tx-mauve); } .blk.special .n { font-style:italic; }
  .brk { display:flex; align-items:center; gap:12px; }
  .brk::before,.brk::after { content:""; flex:1; border-top:1px dashed var(--line); }
  .brk span { letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .eyebrow { letter-spacing:0.34em; text-transform:uppercase; color:var(--rust); }
  .sub { font-style:italic; color:var(--sage); }
  .foot-handle { text-transform:uppercase; letter-spacing:0.16em; color:var(--rust); font-weight:500; }
  .foot-book { text-transform:uppercase; letter-spacing:0.2em; color:var(--muted); }

  /* ---- POST 1080x1350 ---- */
  .post { width:1080px; height:1350px; padding:76px 66px 60px; display:flex; flex-direction:column; }
  .post .mast { text-align:center; margin-bottom:46px; }
  .post .eyebrow { font-size:21px; margin-bottom:22px; }
  .post h1 { font-weight:400; font-size:84px; color:var(--rust); line-height:1; }
  .post .sub { font-size:32px; margin-top:14px; }
  .post .grid { grid-template-columns:84px repeat(7,1fr); column-gap:13px; row-gap:20px; flex:1; align-content:center; }
  .post .dh { font-size:31px; padding-bottom:14px; }
  .post .th { font-size:19px; letter-spacing:0.05em; padding-right:12px; }
  .post .blk { border-radius:12px; padding:12px 8px; }
  .post .blk .n { font-size:25px; } .post .blk .tea { font-size:17px; margin-top:5px; }
  .post .brk { grid-column:2/9; padding:2px 0; } .post .brk span { font-size:16px; }
  .post .foot { margin-top:40px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:28px; }
  .post .foot-handle { font-size:23px; } .post .foot-book { font-size:21px; }

  /* ---- SQUARE 1080x1080 ---- */
  .sq { width:1080px; height:1080px; padding:60px 60px 52px; display:flex; flex-direction:column; }
  .sq .mast { text-align:center; margin-bottom:30px; }
  .sq .eyebrow { font-size:19px; margin-bottom:16px; }
  .sq h1 { font-weight:400; font-size:70px; color:var(--rust); line-height:1; }
  .sq .sub { font-size:28px; margin-top:10px; }
  .sq .grid { grid-template-columns:72px repeat(7,1fr); column-gap:11px; row-gap:16px; flex:1; align-content:center; }
  .sq .dh { font-size:28px; padding-bottom:12px; }
  .sq .th { font-size:17px; letter-spacing:0.05em; padding-right:11px; }
  .sq .blk { border-radius:11px; padding:12px 6px; min-height:84px; }
  .sq .blk .n { font-size:22px; } .sq .blk .tea { font-size:15px; margin-top:4px; }
  .sq .brk { grid-column:2/9; padding:2px 0; } .sq .brk span { font-size:15px; }
  .sq .foot { margin-top:28px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:22px; }
  .sq .foot-handle { font-size:21px; } .sq .foot-book { font-size:19px; }

  /* ---- STORY 1080x1920 (grid + good to know) ---- */
  .story { width:1080px; height:1920px; padding:110px 74px 96px; display:flex; flex-direction:column; justify-content:space-between; }
  .story .mast { text-align:center; margin-bottom:56px; }
  .story .eyebrow { font-size:24px; margin-bottom:24px; }
  .story h1 { font-weight:400; font-size:104px; color:var(--rust); line-height:1; }
  .story .sub { font-size:36px; margin-top:18px; }
  .story .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; align-items:start; }
  .story .col { display:flex; flex-direction:column; }
  .story .chead { text-align:center; padding-bottom:22px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .story .badge { display:inline-block; font-size:18px; letter-spacing:0.18em; text-transform:uppercase; color:var(--rust); border:1px solid var(--rust); border-radius:999px; padding:7px 18px; margin-bottom:18px; }
  .story .badge.ghost { border-color:transparent; color:transparent; }
  .story .dfull { font-family:'Cormorant Garamond',serif; font-size:44px; color:var(--ink); line-height:1; }
  .story .ddate { font-size:20px; letter-spacing:0.14em; text-transform:uppercase; color:var(--rust); font-weight:500; margin-top:12px; }
  .story .cbody { display:flex; flex-direction:column; gap:22px; }
  .story .rcard { border-radius:16px; padding:30px 16px; text-align:center; }
  .story .rcard .rtime { font-size:19px; letter-spacing:0.06em; text-transform:uppercase; opacity:0.85; font-weight:500; margin-bottom:9px; }
  .story .rcard .rname { font-family:'Cormorant Garamond',serif; font-size:35px; font-weight:500; line-height:1.05; }
  .story .rcard .rmeta { font-size:20px; font-style:italic; margin-top:9px; }
  .story .rcard.reformer { background:var(--peach-pale); color:var(--tx-rust); }
  .story .rcard.mat { background:var(--sage-pale); color:var(--tx-sage); }
  .story .rcard.yoga { background:var(--blush-pale); color:var(--tx-mauve); } .story .rcard.yoga .rname { font-style:italic; }
  .story .rcard.special { background:var(--special-pale); color:var(--tx-mauve); } .story .rcard.special .rname { font-style:italic; }
  .story .rest { font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--muted); text-align:center; padding-top:42px; font-size:28px; }
  .story .info { border-left:2px solid var(--rust); padding-left:36px; }
  .story .info-h { font-size:24px; letter-spacing:0.28em; text-transform:uppercase; color:var(--rust); font-weight:500; margin-bottom:26px; }
  .story .irow { display:grid; grid-template-columns:210px 1fr; align-items:baseline; }
  .story .irow + .irow { margin-top:18px; }
  .story .ik { font-size:19px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .story .iv { font-family:'Cormorant Garamond',serif; font-size:30px; color:var(--ink); }
  .story .foot { text-align:center; padding-top:60px; }
  .story .foot-handle { font-size:24px; } .story .foot-book { display:block; font-size:22px; margin-top:14px; }
</style>
</head>
<body>
<div class="app">
  <h2 class="tool">Pura · Instagram Schedule Poster</h2>
  <div class="toolsub">Reads the live schedule sheet. Pick a week and format, then download a ready-to-post image.</div>

  <div class="controls">
    <div class="grp"><label for="wk">Week</label><select id="wk"></select></div>
    <div class="grp"><label>Format</label>
      <div class="seg" id="fmt">
        <button data-f="post" class="on">Post 4:5</button>
        <button data-f="sq">Square 1:1</button>
        <button data-f="story">Story 9:16</button>
      </div>
    </div>
    <button class="dl" id="dl" disabled>Download PNG</button>
  </div>
  <div class="status" id="status">Loading live schedule…</div>

  <div class="stagewrap">
    <div class="scaler" id="scaler"><div id="frame"></div></div>
  </div>
</div>

<script type="module">
const SHEET_ID='1KMnwah9GyzJisURDDVrosugYndyWHKghFqejJcVv3tM';
const SHEET_TAB='Schedule_Master';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
const HANDLE='@purapilatessrilanka';
const BREAK_GAP=90;
const INFO=[
  ['Pricing','Reformer 6,000 · Mat & Yoga 3,000'],
  ['Booking','purapilatessrilanka.com · walk-ins welcome'],
  ['Policy','Cancel 72h before · transfer up to 12h'],
  ['Arrive','10 minutes early to settle in'],
  ['Sunday','Rest day, studio closed'],
];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DFL={Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu',Friday:'Fri',Saturday:'Sat',Sunday:'Sun'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FMT={post:{w:1080,h:1350},sq:{w:1080,h:1080},story:{w:1080,h:1920}};

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mins=t=>{const[a,b]=String(t).split(':').map(Number);return a*60+(b||0);};
const to12=t=>{let[h,m]=String(t).split(':').map(Number);const ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(m||0).padStart(2,'0')+ap;};
const fday=iso=>{const d=new Date(iso+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()];};
function cat(t){t=(t||'').toLowerCase();if(t.includes('mat'))return 'mat';if(t==='reformer'||t==='reformer general'||(t.includes('reformer')&&t.includes('community')))return 'reformer';if(t.includes('yoga'))return 'yoga';if(t.includes('reformer'))return 'special';return 'special';}
const SHORT={'Reformer General':'Reformer','Find your Match Reformer':'Find your Match'};
const short=t=>SHORT[t]||t;

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c==='\r'){}else f+=c}if(f.length||row.length){row.push(f);rows.push(row)}return rows;}

let DATA=null, week=null, fmt='post';

async function load(){
  const res=await fetch(CSV_URL);
  if(!res.ok) throw new Error('Sheet fetch failed '+res.status);
  const rows=parseCSV(await res.text());
  const h=rows[0].map(x=>x.trim());
  const ci={week:h.indexOf('Week Number'),date:h.indexOf('Date'),day:h.indexOf('Day'),time:h.indexOf('Start_Time'),type:h.indexOf('Class_Type'),teacher:h.indexOf('Teacher'),status:h.indexOf('Status')};
  const weeks={};
  for(let r=1;r<rows.length;r++){const row=rows[r];if(!row||!/^\d{4}-\d{2}-\d{2}/.test(row[ci.date]||''))continue;if((row[ci.status]||'').trim().toLowerCase()!=='scheduled')continue;const ty=(row[ci.type]||'').trim();if(ty.startsWith('Private')||ty.startsWith('Studio Rental'))continue;const day=DFL[(row[ci.day]||'').trim()];if(!day)continue;const w=(row[ci.week]||'').trim();(weeks[w]=weeks[w]||{items:[],dates:[]});weeks[w].items.push({day,date:row[ci.date].slice(0,10),time:(row[ci.time]||'').trim(),cls:short(ty),tea:(row[ci.teacher]||'').trim(),cat:cat(ty)});weeks[w].dates.push(row[ci.date].slice(0,10));}
  const order=Object.keys(weeks).sort((a,b)=>+a-+b);
  const byDate={};
  order.forEach(w=>{const ds=weeks[w].dates.sort();weeks[w].start=ds[0];weeks[w].end=ds[ds.length-1];weeks[w].label=fday(ds[0])+' – '+fday(ds[ds.length-1]);weeks[w].items.forEach(it=>{(byDate[it.date]=byDate[it.date]||[]).push(it);});});
  DATA={weeks,order,byDate};
  const iso=new Date().toISOString().slice(0,10);
  week=order.find(w=>weeks[w].start<=iso&&iso<=weeks[w].end)||order.find(w=>weeks[w].start>iso)||order[order.length-1];
  const sel=document.getElementById('wk');
  sel.innerHTML=order.map(w=>`<option value="${w}"${w===week?' selected':''}>Week ${w} · ${weeks[w].label}</option>`).join('');
  document.getElementById('dl').disabled=false;
}

function gridRows(items){
  const times=[...new Set(items.map(i=>i.time))].sort((a,b)=>mins(a)-mins(b));
  const by={}; items.forEach(i=>by[i.time+'|'+i.day]=i);
  const out=[]; let prev=null;
  for(const t of times){ if(prev!==null&&mins(t)-mins(prev)>=BREAK_GAP) out.push({brk:true}); out.push({t,cells:DAYS.map(d=>by[t+'|'+d]||null)}); prev=t; }
  return out;
}
function gridHTML(items){
  const rows=gridRows(items);
  let h='<div class="corner"></div>';
  DAYS.forEach(d=>{const rest=items.some(i=>i.day===d)?'':' rest';h+=`<div class="dh${rest}">${d}</div>`;});
  rows.forEach(r=>{
    if(r.brk){h+='<div class="th"></div><div class="brk"><span>Break</span></div>';return;}
    h+=`<div class="th">${to12(r.t)}</div>`;
    r.cells.forEach(it=>{h+= it?`<div class="cell"><div class="blk ${it.cat}"><div class="n">${esc(it.cls)}</div><div class="tea">with ${esc(it.tea)}</div></div></div>`:'<div class="cell"></div>';});
  });
  return h;
}
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function upcomingDays(n,today){
  today=today||new Date();
  const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const out=[];
  for(let i=0;i<n;i++){const d=new Date(base);d.setDate(base.getDate()+i);const iso=isoLocal(d);
    const items=(DATA.byDate[iso]||[]).slice().sort((a,b)=>mins(a.time)-mins(b.time));
    out.push({iso,dayLong:WD[d.getDay()],dateLabel:fday(iso),badge:i===0?'Today':i===1?'Tomorrow':'',items});}
  return out;
}
function foot(){return `<div class="foot"><div class="foot-handle">${HANDLE}</div><div class="foot-book">Book · link in bio</div></div>`;}
function frameHTML(f,w){
  if(f==='story'){
    const mast=`<div class="mast"><div class="eyebrow">Pura Pilates · Ahangama</div><h1>What&rsquo;s On</h1><div class="sub">the next few days</div></div>`;
    const cols=upcomingDays(3).map(day=>{
      const bh=day.badge?`<span class="badge">${day.badge}</span>`:`<span class="badge ghost">&nbsp;</span>`;
      const body=day.items.length? day.items.map(it=>`<div class="rcard ${it.cat}"><div class="rtime">${to12(it.time)}</div><div class="rname">${esc(it.cls)}</div><div class="rmeta">with ${esc(it.tea)}</div></div>`).join('') : '<div class="rest">Rest day</div>';
      return `<div class="col"><div class="chead">${bh}<div class="dfull">${day.dayLong}</div><div class="ddate">${day.dateLabel}</div></div><div class="cbody">${body}</div></div>`;
    }).join('');
    const info=`<div class="info"><div class="info-h">Good to know</div>${INFO.map(([k,v])=>`<div class="irow"><div class="ik">${esc(k)}</div><div class="iv">${esc(v)}</div></div>`).join('')}</div>`;
    return `<div class="frame story">${mast}<div class="cols">${cols}</div>${info}${foot()}</div>`;
  }
  const wk=DATA.weeks[w]; const items=wk.items;
  const mast=`<div class="mast"><div class="eyebrow">Pura Pilates · Ahangama</div><h1>Weekly Schedule</h1><div class="sub">${esc(wk.label)}</div></div>`;
  const grid=`<div class="grid">${gridHTML(items)}</div>`;
  const cls=f==='sq'?'sq':'post';
  return `<div class="frame ${cls}">${mast}${grid}${foot()}</div>`;
}

function fitScale(){
  const {w,h}=FMT[fmt];
  const availW=document.querySelector('.stagewrap').clientWidth-48;
  const availH=Math.max(window.innerHeight-260,420);
  const s=Math.min(availW/w, availH/h, 1);
  document.getElementById('scaler').style.transform=`scale(${s})`;
  // keep layout box height sensible so the wrap scrolls
  document.getElementById('scaler').style.height=(h*s)+'px';
}
function render(){
  if(!DATA||!week) return;
  document.getElementById('frame').innerHTML=frameHTML(fmt,week);
  fitScale();
  document.getElementById('status').textContent=`Week ${week} · ${DATA.weeks[week].label} — ${fmt.toUpperCase()} (${FMT[fmt].w}×${FMT[fmt].h})`;
}

document.getElementById('wk').addEventListener('change',e=>{week=e.target.value;render();});
document.getElementById('fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fmt=b.dataset.f;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));render();});
window.addEventListener('resize',fitScale);

document.getElementById('dl').addEventListener('click',async()=>{
  const btn=document.getElementById('dl'); btn.disabled=true; const old=btn.textContent; btn.textContent='Rendering…';
  const scaler=document.getElementById('scaler'); const prev=scaler.style.transform; scaler.style.transform='none';
  try{
    await document.fonts.ready;
    const frame=document.querySelector('#frame .frame'); const {w,h}=FMT[fmt];
    const canvas=await html2canvas(frame,{width:w,height:h,windowWidth:w,windowHeight:h,scale:1,backgroundColor:'#fdfaf7',useCORS:true});
    const a=document.createElement('a'); a.download=`pura-week${week}-${fmt}.png`; a.href=canvas.toDataURL('image/png'); a.click();
  }catch(err){ document.getElementById('status').textContent='Download failed: '+err.message; }
  scaler.style.transform=prev; btn.textContent=old; btn.disabled=false;
});

load().then(render).catch(e=>{document.getElementById('status').textContent='Could not load sheet: '+e.message;});
</script>
</body>
</html>
