# Belongs to the puracommunity/ app. This file must live at the repo root
# because GitHub only reads workflows from /.github/workflows — it ignores
# .github folders inside subdirectories. Every step runs inside puracommunity/
# (see `defaults.run.working-directory` below); it never touches the legacy site.
name: Daily Instagram Story

on:
  schedule:
    # 00:07 UTC = 05:37 Asia/Colombo (Sri Lanka, UTC+5:30). This is the
    # earliest date-safe slot: the Story's "today" is the runner's UTC date,
    # so scheduling before 00:00 UTC would flip it to the previous day.
    # The :07 minute (off the top of the hour) shortens GitHub's queue delay,
    # and the early time buffers against it so the post lands in the morning.
    # Note: GitHub cron can still be delayed; it is not exact-to-the-minute.
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + host only, do NOT post to Instagram'
        type: boolean
        default: false

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puracommunity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (with Chromium for Puppeteer)
        run: npm install

      - name: Build app
        run: npm run build

      - name: Serve build
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173

      - name: Render + post Story
        env:
          STORY_URL: http://127.0.0.1:4173/?render=story
          GRAPH_BASE: https://graph.facebook.com
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OUT_PNG: story.png
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: npm run post-story

      - name: Upload PNG artifact (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pura-story
          path: puracommunity/story.png
          if-no-files-found: ignore
